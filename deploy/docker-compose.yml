services:
  bot:
    build: {context: .., dockerfile: deploy/Dockerfile}
    restart: unless-stopped
    env_file: ../.env
    environment:
      - LEDGER_DIR=data/ledger   # live ledger on the data volume; seeded from the repo's ledger/ on first start
    volumes:
      - ../data:/app/data
      - ../knowledge:/app/knowledge
      - ../config:/app/config
      - ../inbox:/app/inbox
