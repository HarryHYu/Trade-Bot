# Hard limits enforced in code after every model decision. The model cannot override these.
max_risk_per_trade_pct: 1.0        # max loss at stop, % of equity
tier_risk_multiplier: {small: 0.4, standard: 1.0, big: 2.0}
max_position_pct: 15               # max notional in one name, % of equity
max_gross_exposure_pct: 120
max_open_positions: 12
max_theme_positions: 3             # correlated cluster cap
daily_loss_halt_pct: 3.0           # halt new trades for the day past this drawdown
dry_powder_pct: 20                 # cash kept back for big-tier opportunities
hedge_beta_with: SPY               # default market hedge
hedge_ratio: 0.5                   # fraction of beta exposure hedged on standard trades
allowed_symbols_regex: "^[A-Z]{1,5}$"
