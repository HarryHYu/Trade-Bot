[project]
name = "tradebot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Claude", email = "noreply@anthropic.com" }
]
requires-python = ">=3.13"
dependencies = [
    "anthropic>=2.3.0",
    "apscheduler>=3.11.3",
    "feedparser>=6.0.14",
    "httpx>=0.28.1",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.1",
    "pyyaml>=6.0.3",
    "scipy>=1.18.1",
    "sqlalchemy>=2.1.6",
    "trafilatura>=2.3.1",
    "typer>=0.27.3",
    "youtube-transcript-api>=1.2.4",
]

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "respx>=0.23.1",
]
